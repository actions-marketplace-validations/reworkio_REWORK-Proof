name: 'REWORK Proof Check'
# Marketplace rejects a description of 125 characters or more, and only says
# so at publish time - after the tag is cut. This one is 118. Keep it a single
# quoted line: a folded >- block reads fine here but makes the length easy to
# grow past the limit without noticing.
description: 'Report who actually wrote the commits in a pull request: signature state, author attribution, disclosed AI assistance.'
author: 'REWORK Digital'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    description: >-
      Token used to read the pull request's commits. The default workflow
      token is enough; it needs no permissions beyond the read access the
      workflow already has.
    required: false
    # Expression syntax belongs here, where GitHub evaluates it - not in the
    # description above, where it is only ever displayed to a reader. This is
    # the same default actions/github-script uses, and it is what lets the
    # action work with no configuration at all.
    default: ${{ github.token }}

  attest:
    description: >-
      Request a signed attestation from REWORK. Requires `id-token: write`
      on the job. No account or API key is needed - the workflow proves its
      own identity with a short-lived OIDC token. Leave false and the action
      runs entirely locally, sending nothing anywhere.
    required: false
    default: 'false'

  api-url:
    description: 'REWORK API base. Override only for self-hosted deployments.'
    required: false
    default: 'https://api.reworkdigital.io/api/v1'

  fail-on-unsigned:
    description: >-
      Fail the check when any commit is unsigned. Off by default and we
      recommend leaving it off: most repositories never enable signing, and
      an unsigned commit is not a defect.
    required: false
    default: 'false'

  hf-repo:
    description: >-
      Hugging Face repository (owner/name) to JOIN this run to, read AFTER
      your own upload step. The action reads the repo's current state and
      asks REWORK to tie it to this run - REWORK re-reads the repo itself
      and only issues a credential when the content matches, the repo
      carries your verified REWORK control claim, and the same REWORK
      account links this GitHub owner's App installation. Requires
      `attest: true` and `id-token: write`. The action NEVER uploads:
      publishing to the Hub stays your own workflow step, with your own
      credentials, before this one.
    required: false
    default: ''

  hf-token:
    description: >-
      Hugging Face READ token used only to read the repository state
      (private repos, and steadier rate limits than the runner's shared
      anonymous quota). A fine-grained token with read-only content
      permission is exactly enough - never pass a write token; the action
      has no use for one.
    required: false
    default: ''

outputs:
  commits-total:
    description: 'Number of commits examined.'
    value: ${{ steps.verify.outputs.commits-total }}
  commits-signed:
    description: 'How many carried a signature GitHub could verify.'
    value: ${{ steps.verify.outputs.commits-signed }}
  commits-foreign:
    description: >-
      Commits attributed to a human account other than the PR author.
      Bot accounts are counted under commits-automation instead.
    value: ${{ steps.verify.outputs.commits-foreign }}
  commits-automation:
    description: >-
      Commits authored by a bot account ("[bot]" suffix) — dependency
      bumps, workflow commits. Listed separately from human co-authors.
    value: ${{ steps.verify.outputs.commits-automation }}
  ai-disclosed:
    description: 'Commits whose message declares AI assistance.'
    value: ${{ steps.verify.outputs.ai-disclosed }}
  credential:
    description: >-
      The signed VC-JWT, when attest is enabled. Verify it offline against
      https://api.reworkdigital.io/api/v1/proofs/credentials/jwks.json
    value: ${{ steps.verify.outputs.credential }}
  credential-sha256:
    description: 'Digest the OpenTimestamps receipt covers.'
    value: ${{ steps.verify.outputs.credential-sha256 }}
  timestamp-status:
    description: >-
      "submitted" when a calendar accepted the digest, "unavailable" when
      none were reachable. Never "confirmed" - that needs a Bitcoin block.
    value: ${{ steps.verify.outputs.timestamp-status }}
  ots-receipt:
    description: >-
      Base64 of the detached .ots file. Write it to disk and verify or
      upgrade it with standard `ots` tooling.
    value: ${{ steps.verify.outputs.ots-receipt }}
  hf-join-outcome:
    description: >-
      Result of the Hugging Face join when hf-repo is set: "joined",
      "unbound", "mismatch", or "ambiguous". Only "joined" carries a
      credential; the others are neutral statuses with guidance in the job
      summary, never failures.
    value: ${{ steps.verify.outputs.hf-join-outcome }}
  hf-join-credential:
    description: 'The signed joined VC-JWT, when the join promoted.'
    value: ${{ steps.verify.outputs.hf-join-credential }}
  hf-manifest-digest:
    description: >-
      sha256 manifest digest of the HF repo tree the join describes
      (sorted path:oid:size lines, LFS sha preferred).
    value: ${{ steps.verify.outputs.hf-manifest-digest }}

runs:
  # Composite running a dependency-free Node script, deliberately, rather
  # than a `node20` action with a bundled dist/. A bundle means a build step
  # and a committed artefact that nobody reviews and that silently drifts
  # from src/. Node 20 ships global fetch, so this needs no packages at all
  # and what you read here is what runs.
  using: 'composite'
  steps:
    - id: verify
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.js"
      env:
        RP_GITHUB_TOKEN: ${{ inputs.github-token }}
        RP_ATTEST: ${{ inputs.attest }}
        RP_API_URL: ${{ inputs.api-url }}
        RP_FAIL_ON_UNSIGNED: ${{ inputs.fail-on-unsigned }}
        RP_REPOSITORY: ${{ github.repository }}
        RP_EVENT_PATH: ${{ github.event_path }}
        RP_API_SERVER: ${{ github.api_url }}
        RP_HF_REPO: ${{ inputs.hf-repo }}
        RP_HF_TOKEN: ${{ inputs.hf-token }}
