name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Script parses and action.yml is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node syntax check
        run: node --check src/main.js

      - name: action.yml is valid YAML with the required Marketplace fields
        run: |
          python3 - <<'PY'
          import sys, yaml
          a = yaml.safe_load(open('action.yml'))
          # Marketplace refuses a listing missing any of these, and the error
          # arrives at publish time - long after the tag is cut.
          for field in ('name', 'description', 'runs', 'branding'):
              assert a.get(field), f'action.yml is missing {field}'
          assert a['branding'].get('icon') and a['branding'].get('color'), \
              'branding needs both icon and color'
          # Marketplace refuses 125 characters or more, and only says so on the
          # Release page - after the tag is cut and the release is half made.
          n = len(a['description'])
          assert n < 125, \
              f'description is {n} chars; Marketplace requires fewer than 125'
          print(f'description: {n}/124 chars')

          # Every description here is shown verbatim - on the Marketplace
          # listing and in editor tooltips - and never evaluated. An
          # expression in one renders as literal ${{ ... }} noise to the
          # reader, and looks like a mistake to every linter that sees it.
          def descriptions(node, path='action.yml'):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == 'description' and isinstance(v, str):
                          yield path, v
                      else:
                          yield from descriptions(v, f'{path}.{k}')
          for where, text in descriptions(a):
              assert '${{' not in text, \
                  f'{where} has an expression in prose: {text.strip()[:70]}'
          print('no expressions in any description')
          assert a['runs']['using'] == 'composite', a['runs']['using']
          print('action.yml OK:', a['name'])
          PY

  dogfood:
    name: Run against this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The action verifies its own pull requests. If it cannot survive its
      # own repository it has no business running in anyone else's.
      - uses: ./
        id: proof

      - name: The action produced counts
        run: |
          echo "total=${{ steps.proof.outputs.commits-total }}"
          echo "signed=${{ steps.proof.outputs.commits-signed }}"
          test -n "${{ steps.proof.outputs.commits-total }}"
